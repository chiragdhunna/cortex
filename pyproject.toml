[project]
name = "cortex"
version = "0.1.0"
description = "Multi-modal, category-aware notes generation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "pydantic>=2.7",
  "pydantic-settings>=2.3", "celery>=5.4", "redis>=5.0", "PyMuPDF>=1.24",
  "httpx>=0.27", "yt-dlp>=2024.7.1", "faster-whisper>=1.0", "weasyprint>=62.3",
  "python-multipart>=0.0.9", "google-generativeai>=0.7"
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
